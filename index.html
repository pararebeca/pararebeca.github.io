<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simulador de Piso AR - Prueba Visual Directa</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background-color: #1e1e24;
      color: #fff;
      margin: 0;
      padding: 15px;
    }
    .container {
      position: relative;
      width: 100%;
      max-width: 640px;
      margin: 0 auto;
      border: 2px solid #444;
      border-radius: 8px;
      overflow: hidden;
    }
    video, canvas {
      width: 100%;
      display: block;
    }
    canvas {
      position: absolute;
      top: 0;
      left: 0;
    }
    .controls {
      max-width: 640px;
      margin: 15px auto;
      background: #2b2b36;
      padding: 15px;
      border-radius: 8px;
      text-align: left;
    }
    .control-group {
      margin-bottom: 10px;
    }
    label {
      display: inline-block;
      width: 160px;
      font-size: 14px;
    }
    input[type=range] {
      width: calc(100% - 170px);
      vertical-align: middle;
    }
    #status {
      margin-bottom: 10px;
      color: #4da6ff;
    }
  </style>
</head>
<body>

  <h2>Simulador de Piso - Prueba Interactiva</h2>
  <div id="status">Iniciando cámara...</div>

  <div class="container">
    <video id="webcam" autoplay playsinline muted></video>
    <canvas id="outputCanvas"></canvas>
  </div>

  <div class="controls">
    <div class="control-group">
      <label for="horizon">Horizonte / Altura Piso:</label>
      <input type="range" id="horizon" min="0.1" max="0.9" step="0.05" value="0.4">
    </div>
    <div class="control-group">
      <label for="opacity">Intensidad del Piso:</label>
      <input type="range" id="opacity" min="0.1" max="1" step="0.1" value="0.6">
    </div>
  </div>

  <script>
    const video = document.getElementById('webcam');
    const canvas = document.getElementById('outputCanvas');
    const ctx = canvas.getContext('2d');
    const statusDiv = document.getElementById('status');
    const horizonSlider = document.getElementById('horizon');
    const opacitySlider = document.getElementById('opacity');

    // 1. Iniciar la cámara del dispositivo
    async function setupCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: 'environment', width: { ideal: 640 }, height: { ideal: 480 } },
          audio: false
        });
        video.srcObject = stream;
        return new Promise((resolve) => {
          video.onloadedmetadata = () => resolve(video);
        });
      } catch (e) {
        statusDiv.innerText = "Error: Asegúrate de otorgar permisos a la cámara o usar un servidor local (localhost).";
      }
    }

    // 2. Procesar y Renderizar
    function processFrame() {
      if (video.videoWidth > 0 && video.videoHeight > 0) {
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;

        // Dibujar el video base en el canvas
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

        // Obtener parámetros de los controles
        const horizonRatio = parseFloat(horizonSlider.value);
        const opacity = parseFloat(opacitySlider.value);

        const startY = canvas.height * horizonRatio;
        const floorHeight = canvas.height - startY;

        // Aplicar la capa del nuevo material (Piso de prueba color terracota/madera)
        ctx.save();
        ctx.fillStyle = `rgba(180, 80, 30, ${opacity})`;
        
        // Creamos un trapecio simulando la perspectiva del suelo
        ctx.beginPath();
        ctx.moveTo(0, startY);
        ctx.lineTo(canvas.width, startY);
        ctx.lineTo(canvas.width, canvas.height);
        ctx.lineTo(0, canvas.height);
        ctx.closePath();
        ctx.fill();

        ctx.restore();
      }

      requestAnimationFrame(processFrame);
    }

    async function main() {
      await setupCamera();
      statusDiv.innerText = "Cámara activa. Mueve los deslizadores de abajo si deseas ajustar el área del piso.";
      video.play();
      processFrame();
    }

    main();
  </script>
</body>
</html>
